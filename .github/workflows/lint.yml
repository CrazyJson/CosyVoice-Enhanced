# 工作流名称
name: Build and Push Docker Image

# 触发条件：推送到main分支或PR合并到main分支时执行
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：设置Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤3：登录Docker Hub（仅推送时保留）
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 步骤4：构建并推送（核心修改：指定Dockerfile路径）
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          # 构建上下文：项目根目录（根据你的实际依赖调整）
          context: .
          # 关键：指定Dockerfile的路径（docker目录下）
          file: ./docker/Dockerfile
          # 是否推送镜像（false仅构建，true推送）
          push: true
          # 镜像标签（替换为你的用户名和项目名）
          tags: ${{ secrets.DOCKER_USERNAME }}/your-project-name:latest
          # 启用缓存加速构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
